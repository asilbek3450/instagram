<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Instagram Analytics Pro</title>
    <!-- Favicon and Touch Icons -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <!-- Apply saved theme before first paint (Bootstrap reads data-bs-theme) -->
    <meta name="color-scheme" content="light dark">
    <script>
    {
      const colorScheme = localStorage.getItem("color-scheme") || "dark";
      document.querySelector('meta[name="color-scheme"]').content = colorScheme;
      document.documentElement.style.colorScheme = colorScheme;
      document.documentElement.setAttribute("data-bs-theme", colorScheme);
    }
    </script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-app), rgba(168, 85, 247, 0.05));
        }
    </style>
</head>
<body>

    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <a href="/" class="fw-bold fs-3 text-decoration-none gradient-text"><img src="{{ url_for('static', filename='images/InstaTrackPro_icon.svg') }}" alt="Logo" class="me-2" style="width: 32px; height: 32px;">InstaTrack Pro</a>
            <h5 class="text-secondary mt-2">Get started for free</h5>
        </div>
        
        <div class="glass-card shadow-lg p-4">
            <div id="alert-container"></div>
            
            <form id="register-form">
                <div class="mb-3">
                    <label for="email" class="form-label" data-i18n="lbl_email">Email / Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="text" class="form-control form-glass border-start-0 ps-1" id="email" placeholder="name@example.com" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control form-glass border-start-0 ps-1" id="password" placeholder="Min. 6 characters" required>
                    </div>
                </div>
                <!-- Role selection removed. All users default to 'user' -->
                <button type="submit" class="btn gradient-btn w-100 py-2.5 mt-2"><i class="bi bi-person-plus-fill me-1"></i>Create Account</button>
            </form>
            
            <div class="my-3 text-center position-relative">
                <hr class="text-muted opacity-25">
                <span class="position-absolute top-50 start-50 translate-middle px-2 small text-muted" style="background: var(--bg-card, #1e1e2e);">OR</span>
            </div>

            <button type="button" id="google-register-btn" onclick="registerWithGoogle()" class="btn btn-outline-secondary w-100 py-2.5 d-flex align-items-center justify-content-center gap-2 fw-medium shadow-sm" style="border-radius: 8px;">
                <svg width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Continue with Google</span>
            </button>
            
            <div class="text-center mt-4">
                <span class="text-muted small">Already have an account?</span>
                <a href="/login" class="small text-decoration-none fw-bold ms-1">Sign In</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = '';
            
            if (password.length < 6) {
                alertContainer.innerHTML = `<div class="alert alert-danger">Password must be at least 6 characters.</div>`;
                return;
            }
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    alertContainer.innerHTML = `<div class="alert alert-success">Registration successful! Redirecting to login...</div>`;
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1200);
                } else {
                    alertContainer.innerHTML = `<div class="alert alert-danger">${data.error || 'Registration failed'}</div>`;
                }
            } catch (err) {
                alertContainer.innerHTML = `<div class="alert alert-danger">Server connection error. Please try again.</div>`;
            }
        });

        function registerWithGoogle() {
            const width = 480;
            const height = 640;
            const left = (window.screen.width / 2) - (width / 2);
            const top = (window.screen.height / 2) - (height / 2);
            window.open('/api/auth/google/login', 'GoogleAuth', `width=${width},height=${height},top=${top},left=${left},toolbar=no,menubar=no,scrollbars=yes`);
        }

        window.addEventListener('message', (event) => {
            if (event.origin !== window.location.origin) return;
            if (event.data && event.data.type === 'GOOGLE_LOGIN_SUCCESS') {
                const userData = event.data.user;
                if (userData && userData.access_token) {
                    localStorage.setItem('access_token', userData.access_token);
                    localStorage.setItem('user', JSON.stringify(userData.user));
                    const alertContainer = document.getElementById('alert-container');
                    if (alertContainer) {
                        alertContainer.innerHTML = `<div class="alert alert-success"><i class="bi bi-check-circle me-1"></i>Google Registration successful! Redirecting...</div>`;
                    }
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 600);
                }
            } else if (event.data && event.data.type === 'GOOGLE_AUTH_ERROR') {
                const alertContainer = document.getElementById('alert-container');
                if (alertContainer) {
                    alertContainer.innerHTML = `<div class="alert alert-danger">Google sign-in failed: ${event.data.error || 'Unknown error'}</div>`;
                }
            }
        });
    </script>
</body>
</html>
